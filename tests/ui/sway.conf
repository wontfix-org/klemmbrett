# Sway config for the UI placement test, and the outer compositor that hosts
# a nested COSMIC.
#
# XWayland is off for the same reason as in tests/sway_config.
xwayland disable

output HEADLESS-1 resolution 1280x800 position 0 0 bg #000000 solid_color
default_border none
focus_follows_mouse no

# A nested compositor is the only window here. Fullscreen puts its output at
# the outer origin with the outer size, so the outer screenshot needs no crop.
for_window [all] fullscreen enable
