[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "klemmbrett-rpc"
version = "0.1.0"
description = "A standard-library Varlink client for the klemmbrett daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/wontfix-org/klemmbrett"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
