[package]
name = "klemmbrett"
version = "0.1.0"
edition = "2021"

[lib]
name = "klemmbrett"
path = "src/lib.rs"

[[bin]]
name = "klemmbrett"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
gdk = "0.18"
glib = "0.18"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
zbus = "5"

[dev-dependencies]
tempfile = "3"
