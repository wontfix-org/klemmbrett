[package]
name = "klemmbrett"
version = "0.1.0"
edition = "2021"

[lib]
name = "klemmbrett"
path = "src/lib.rs"

[[bin]]
name = "klemmbrett"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }
async-channel = "2"
clap = { version = "4", features = ["derive"] }
gpui = { package = "gpui-ce", version = "0.3" }
hcl-rs = "0.19"
gpui_platform = { package = "gpui_ce_platform", version = "0.3", default-features = false, features = ["wayland"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
